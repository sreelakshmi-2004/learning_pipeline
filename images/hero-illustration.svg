<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DDD6FE" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4C1D95" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background decorative elements -->
  <circle cx="260" cy="200" r="160" fill="url(#bgGlow)" filter="blur(20px)" />
  <circle cx="430" cy="90" r="45" fill="#E9D5FF" opacity="0.6"/>
  <circle cx="80" cy="310" r="35" fill="#DDD6FE" opacity="0.5"/>

  <!-- Connecting pipeline circuit lines -->
  <path d="M 120 180 L 190 180 L 230 220 L 330 220 L 370 180 L 410 180" 
        fill="none" stroke="#C4B5FD" stroke-width="2.5" stroke-dasharray="6,6"/>
  <path d="M 260 90 L 260 140" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <path d="M 260 260 L 260 310" fill="none" stroke="#A78BFA" stroke-width="2"/>

  <!-- Central DevOps Hub Card -->
  <g filter="url(#softShadow)">
    <rect x="160" y="130" width="200" height="140" rx="20" fill="url(#cardGrad)" stroke="#DDD6FE" stroke-width="2"/>
    
    <!-- Code Window Dots -->
    <circle cx="185" cy="150" r="4" fill="#F87171"/>
    <circle cx="197" cy="150" r="4" fill="#FBBF24"/>
    <circle cx="209" cy="150" r="4" fill="#34D399"/>
    
    <!-- DevOps Infinity Symbol -->
    <path d="M 225 200 C 205 200, 195 212, 195 220 C 195 228, 205 240, 225 240 C 245 240, 275 200, 295 200 C 315 200, 325 212, 325 220 C 325 228, 315 240, 295 240 C 275 240, 245 200, 225 200 Z"
          fill="none" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Pulse nodes -->
    <circle cx="225" cy="220" r="4" fill="#6D28D9"/>
    <circle cx="295" cy="220" r="4" fill="#8B5CF6"/>
    
    <text x="260" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4C1D95" text-anchor="middle">CI/CD PIPELINE</text>
  </g>

  <!-- Left Card: Code & Commit -->
  <g filter="url(#softShadow)">
    <rect x="40" y="110" width="115" height="90" rx="14" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1.5"/>
    <rect x="52" y="125" width="28" height="28" rx="7" fill="#F3E8FF"/>
    <path d="M 60 139 L 66 133 L 60 127 M 69 143 L 75 143" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="52" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F2937">Source Code</text>
    <text x="52" y="186" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280">Git &amp; Linting</text>
    <circle cx="135" cy="125" r="4" fill="#10B981"/>
  </g>

  <!-- Top Card: Build & Test -->
  <g filter="url(#softShadow)">
    <rect x="205" y="30" width="110" height="75" rx="14" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1.5"/>
    <circle cx="225" cy="52" r="12" fill="#EDE9FE"/>
    <path d="M 221 52 L 224 55 L 229 49" stroke="#6D28D9" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="245" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F2937">Build &amp; Test</text>
    <text x="245" y="66" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Passed (100%)</text>
    <rect x="220" y="80" width="80" height="5" rx="2.5" fill="#E9D5FF"/>
    <rect x="220" y="80" width="60" height="5" rx="2.5" fill="#8B5CF6"/>
  </g>

  <!-- Right Card: Container & Cloud -->
  <g filter="url(#softShadow)">
    <rect x="365" y="110" width="115" height="90" rx="14" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1.5"/>
    <rect x="377" y="125" width="28" height="28" rx="7" fill="#F3E8FF"/>
    <!-- Container Icon -->
    <rect x="382" y="132" width="6" height="5" rx="1" fill="#7C3AED"/>
    <rect x="390" y="132" width="6" height="5" rx="1" fill="#7C3AED"/>
    <rect x="382" y="139" width="6" height="5" rx="1" fill="#7C3AED"/>
    <rect x="390" y="139" width="6" height="5" rx="1" fill="#7C3AED"/>
    <text x="377" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F2937">Containers</text>
    <text x="377" y="186" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280">K8s &amp; Docker</text>
    <circle cx="460" cy="125" r="4" fill="#3B82F6"/>
  </g>

  <!-- Bottom Card: Observability & IaC -->
  <g filter="url(#softShadow)">
    <rect x="180" y="295" width="160" height="80" rx="14" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1.5"/>
    <rect x="195" y="310" width="26" height="26" rx="6" fill="#F5F3FF"/>
    <path d="M 200 327 L 204 321 L 209 324 L 216 316" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="230" y="323" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F2937">Monitoring &amp; Telemetry</text>
    <text x="230" y="337" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280">Prometheus + Grafana</text>
    <text x="195" y="360" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#10B981">Uptime: 99.99% • Healthy</text>
  </g>
</svg>
